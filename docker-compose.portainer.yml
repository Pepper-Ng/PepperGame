x-ogamex-environment: &ogamex-environment
  APP_NAME: ${APP_NAME:-OGameX}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-error}
  APP_URL: ${APP_URL:-https://localhost}
  DEBUGBAR_ENABLED: ${DEBUGBAR_ENABLED:-false}
  DEBUGBAR_REMOTE_SITES_PATH: /var/www
  DEBUGBAR_LOCAL_SITES_PATH: ${DEBUGBAR_LOCAL_SITES_PATH:-/var/www}
  DISCORD_ALERT_WEBHOOK: ${DISCORD_ALERT_WEBHOOK:-}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ogamex-db
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-change-me}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  CACHE_STORE: ${CACHE_STORE:-file}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-720}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: ${REDIS_PORT:-6379}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OGameX}
  PUSHER_APP_ID: ${PUSHER_APP_ID:-}
  PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
  PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-}
  PUSHER_HOST: ${PUSHER_HOST:-}
  PUSHER_PORT: ${PUSHER_PORT:-443}
  PUSHER_SCHEME: ${PUSHER_SCHEME:-https}
  PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
  REVERB_APP_ID: ${REVERB_APP_ID:-ogamex}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-ogamex-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-ogamex-secret}
  REVERB_HOST: ${REVERB_HOST:-localhost}
  REVERB_PORT: ${REVERB_PORT:-443}
  REVERB_SCHEME: ${REVERB_SCHEME:-https}
  REVERB_SERVER_HOST: ${REVERB_SERVER_HOST:-0.0.0.0}
  REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8090}
  BOOTSTRAP_FROM_ENV: "1"

x-ogamex-app-service: &ogamex-app-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      OPCACHE_ENABLE: "1"
  restart: unless-stopped
  tty: true
  working_dir: /var/www
  volumes:
    - ogame-storage:/var/www/storage
    - ogame-bootstrap-cache:/var/www/bootstrap/cache
    - ogame-vendor:/var/www/vendor
  networks:
    - app-network

services:
  ogamex-db:
    build:
      context: .
      dockerfile: docker/mariadb.portainer.Dockerfile
    restart: unless-stopped
    tty: true
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      SERVICE_TAGS: prod
      SERVICE_NAME: mysql
    volumes:
      - ogame-dbdata:/var/lib/mysql
    networks:
      app-network:
        aliases:
          - ogame-db

  ogamex-app:
    <<: *ogamex-app-service
    environment:
      <<: *ogamex-environment
      CONTAINER_ROLE: app
      SERVICE_NAME: app
      SERVICE_TAGS: prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000 || [ $? -eq 56 ]"]
      interval: 10s
      timeout: 6s
      retries: 60
    depends_on:
      - ogamex-db

  ogamex-webserver:
    build:
      context: .
      dockerfile: docker/nginx.portainer.Dockerfile
    restart: unless-stopped
    tty: true
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  ogamex-scheduler:
    <<: *ogamex-app-service
    environment:
      <<: *ogamex-environment
      CONTAINER_ROLE: scheduler
    depends_on:
      ogamex-app:
        condition: service_healthy

  ogamex-queue-worker:
    <<: *ogamex-app-service
    environment:
      <<: *ogamex-environment
      CONTAINER_ROLE: queue
    depends_on:
      ogamex-app:
        condition: service_healthy

  ogamex-reverb:
    <<: *ogamex-app-service
    environment:
      <<: *ogamex-environment
      CONTAINER_ROLE: reverb
    ports:
      - "${REVERB_SERVER_PORT:-8090}:${REVERB_SERVER_PORT:-8090}"
    depends_on:
      ogamex-app:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  ogame-dbdata:
    driver: local
  ogame-storage:
    driver: local
  ogame-bootstrap-cache:
    driver: local
  ogame-vendor:
    driver: local